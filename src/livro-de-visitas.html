<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevFolio — Livro de Visitas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <p class="site-header__brand">DevFolio</p>
    <nav aria-label="Navegação principal">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="projeto.html">Projeto (exemplo)</a></li>
        <li><a href="livro-de-visitas.html" aria-current="page">Livro de Visitas</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section aria-labelledby="livro-titulo">
      <h1 id="livro-titulo">Livro de Visitas</h1>
      <p>Passou por aqui? Deixe seu nome e uma mensagem para mim.</p>

      <!--
        Etapa 05: o formulário agora envia a mensagem via POST assíncrono
        para um serviço simulado (JSONPlaceholder), usando fetch + async/await.
        Enquanto envia, o botão mostra "Enviando..." e fica desabilitado.
        Se der erro de rede, mostra mensagem de erro.
      -->
      <form action="#" method="post" id="form-livro-visitas" novalidate>
        <div class="campo">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" required>
          <!-- Onde o JS escreve a mensagem de erro, se o campo estiver inválido -->
          <span class="erro-campo" id="erro-nome" role="alert"></span>
        </div>

        <div class="campo">
          <label for="mensagem">Mensagem</label>
          <textarea id="mensagem" name="mensagem" rows="4" required></textarea>
          <span class="erro-campo" id="erro-mensagem" role="alert"></span>
        </div>

        <button type="submit">Enviar mensagem</button>
      </form>
    </section>

    <section aria-labelledby="mensagens-titulo">
      <h2 id="mensagens-titulo">Mensagens de visitantes</h2>

      <!--
        Etapa 05: a lista começa vazia — as mensagens são buscadas via
        fetch de dados/mensagens.json e renderizadas pelo JavaScript.
        Enquanto carrega, aparece "Carregando mensagens...".
      -->
      <ul class="mensagens" id="lista-mensagens"></ul>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 DevFolio — Projeto acadêmico.</p>
  </footer>

  <!--
    Etapa 05: type="module" permite import/export entre arquivos JS.
    Módulos ES são defer por padrão (esperam o DOM carregar).
  -->
  <script type="module" src="js/livro-de-visitas.js"></script>
</body>
</html>
